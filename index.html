<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Resort Daily Inventory System</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A5C3A">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolMar Inventory">

  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

  <div class="topbar">
    <div class="topbar-brand">
      <img class="topbar-logo" src="icon-192.png" alt="Sol Mar Iloilo logo" style="object-fit:cover;">
      <div>
        <div class="topbar-title">Resort Inventory</div>
      </div>
    </div>
    <div class="topbar-date" id="top-date"></div>
    <div class="topbar-right">
      <div class="dept-toggle" id="dept-toggle">
        <button class="dept-tab active" onclick="setDept('housekeeping')" id="tab-housekeeping">
          <span class="dept-tab-icon">🧹</span><span class="dept-tab-label">Housekeeping</span>
          <span class="dept-badge" id="badge-housekeeping">—</span>
        </button>
        <button class="dept-tab" onclick="setDept('bar')" id="tab-bar">
          <span class="dept-tab-icon">🍹</span><span class="dept-tab-label">Bar</span>
          <span class="dept-badge" id="badge-bar">—</span>
        </button>
        <button class="dept-tab" onclick="setDept('kitchen')" id="tab-kitchen">
          <span class="dept-tab-icon">🍽️</span><span class="dept-tab-label">Kitchen</span>
          <span class="dept-badge" id="badge-kitchen">—</span>
        </button>
        <button class="dept-tab" onclick="setDept('pizzeria')" id="tab-pizzeria">
          <span class="dept-tab-icon">🍕</span><span class="dept-tab-label">Pizzeria</span>
          <span class="dept-badge" id="badge-pizzeria">—</span>
        </button>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark mode">🌙</button>
    </div>
  </div>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-label">Views</div>
      <button class="dept-btn active" onclick="setView('form')" id="btn-form">
        <span class="dept-icon">📝</span> Entry Form
      </button>
      <button class="dept-btn" onclick="setView('report')" id="btn-report">
        <span class="dept-icon">📊</span> Summary & Alerts
      </button>
      <button class="dept-btn" onclick="setView('purchase-report')" id="btn-purchase-report">
        <span class="dept-icon">🧾</span> Purchase Order
      </button>
      <button class="dept-btn" onclick="setView('dashboard')" id="btn-dashboard" style="display:none;">
        <span class="dept-icon">📈</span> Dashboard
      </button>
    </nav>

    <main class="main" id="main-content"></main>
  </div>

  <!-- Install prompt banner: appears bottom of screen, dismissed permanently on "Got it" -->
  <div id="install-banner" class="install-banner">
    <img src="icon-192.png" alt="" class="install-banner-icon">
    <div class="install-banner-text">
      <strong>Install this app</strong>
      <span id="install-banner-msg">Add it to your home screen for quick, offline-ready access.</span>
    </div>
    <div class="install-banner-actions">
      <button id="install-banner-action" class="install-banner-install-btn">Install</button>
      <button id="install-banner-dismiss" class="install-banner-dismiss-btn">Got it</button>
    </div>
  </div>

  <script src="app-firebase.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(err => console.warn('Service worker registration failed:', err));
      });
    }
  </script>

  <script>
  /* ── CUSTOM INSTALL PROMPT BANNER ──
     Chrome/Edge fire `beforeinstallprompt`, which lets us trigger the real
     native install dialog from our own "Install" button. iOS Safari has no
     such API — installing there is only possible manually via the Share
     sheet — so on iOS we instead show instructions with just a "Got it"
     button. "Got it" only hides the banner for the current page view —
     it reappears on the next time the site is opened, unless the app has
     since actually been installed (checked via display-mode below). */
  (function () {
    var banner      = document.getElementById('install-banner');
    var msgEl       = document.getElementById('install-banner-msg');
    var installBtn  = document.getElementById('install-banner-action');
    var dismissBtn  = document.getElementById('install-banner-dismiss');
    var deferredPrompt = null;

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true; // iOS Safari's own flag
    }
    function isIos() {
      return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    }
    function show() {
      if (isStandalone()) return;
      banner.classList.add('visible');
    }
    function hide() {
      banner.classList.remove('visible');
    }

    dismissBtn.addEventListener('click', hide);

    if (isIos()) {
      // No install API on iOS — just show manual instructions, no Install button.
      installBtn.style.display = 'none';
      msgEl.textContent = 'Tap the Share icon, then "Add to Home Screen".';
      if (!isStandalone()) show();
    } else {
      // Chrome/Edge (desktop & Android): capture the native prompt instead of
      // letting the browser show its own mini-infobar, so ours is the only one.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        show();
      });

      installBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          hide();
        });
      });
    }

    window.addEventListener('appinstalled', hide);
  })();
  </script>
</body>
</html>
